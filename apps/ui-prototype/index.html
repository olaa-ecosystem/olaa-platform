<style>
/* Layout: phone mockup on the left, decision panel on the right; stacks on phones. */
:root {
  --violet: #484AAA;      /* Violet Blue: Olaa brand, Language */
  --indigo: #9791F1;      /* Tropical Indigo: Note */
  --orchid: #9847B4;      /* Medium Orchid: Habits */
  --pale: #F7EBF9;        /* Pale Purple: page background */
  --lavender: #DDC2F2;    /* Pale Lavender: chips, borders, selected */
  --black: #000000;
  --white: #FFFFFF;

  --bg: var(--pale);
  --surface: var(--white);
  --fg: var(--black);
  --fg-soft: rgba(0, 0, 0, 0.62);
  --line: var(--lavender);
  --chip: var(--white);
  --block-ink: var(--black);
  --block-ink-fg: var(--white);
  --nav: var(--black);
  --nav-fg: var(--white);
  --nav-active: var(--white);
  --nav-active-fg: var(--black);
  --focus: var(--violet);
  --paper: var(--white);
  --paper-line: rgba(72, 74, 170, 0.18);
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Inter', 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif;
  --r-card: 28px;
  --r-pill: 999px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: var(--black); --surface: rgba(255,255,255,0.08); --fg: var(--white); --fg-soft: rgba(255,255,255,0.68);
    --line: rgba(221,194,242,0.28); --chip: rgba(255,255,255,0.08); --block-ink: rgba(255,255,255,0.1); --block-ink-fg: var(--white);
    --nav: rgba(255,255,255,0.12); --nav-fg: var(--white); --nav-active: var(--indigo); --nav-active-fg: var(--black);
    --focus: var(--indigo); --paper: #121212; --paper-line: rgba(151,145,241,0.22); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: var(--black); --surface: rgba(255,255,255,0.08); --fg: var(--white); --fg-soft: rgba(255,255,255,0.68);
  --line: rgba(221,194,242,0.28); --chip: rgba(255,255,255,0.08); --block-ink: rgba(255,255,255,0.1); --block-ink-fg: var(--white);
  --nav: rgba(255,255,255,0.12); --nav-fg: var(--white); --nav-active: var(--indigo); --nav-active-fg: var(--black);
  --focus: var(--indigo); --paper: #121212; --paper-line: rgba(151,145,241,0.22); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; transition: background .3s, color .3s; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.wrap { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; align-items: flex-start; padding-block: 32px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- phone ---------- */
.phone { position: relative; width: min(375px, 100%); height: 760px; border-radius: 48px; background: var(--bg); border: 10px solid var(--black); box-shadow: 0 30px 60px rgba(72,74,170,0.18); overflow: hidden; display: flex; flex-direction: column; }
:root[data-theme="dark"] .phone { border-color: #2a2a2a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .phone { border-color: #2a2a2a; } }
.status { display: flex; justify-content: space-between; align-items: center; padding: 12px 26px 4px; font-weight: 600; font-size: 14px; }
.island { width: 96px; height: 26px; border-radius: 20px; background: var(--black); }
.topbar { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 10px 16px 4px; }
.screen { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 6px 16px 110px; scrollbar-width: none; }
.screen::-webkit-scrollbar { display: none; }
.screen.leaving { animation: leave .22s ease-in forwards; }
.screen.entering { animation: enter .38s cubic-bezier(.2,.8,.2,1); }
@keyframes leave { to { opacity: 0; transform: translateY(10px) scale(.98); } }
@keyframes enter { from { opacity: 0; transform: translateY(16px) scale(.98); } }
.reveal > * { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
.reveal > *:nth-child(2) { animation-delay: .04s } .reveal > *:nth-child(3) { animation-delay: .08s } .reveal > *:nth-child(4) { animation-delay: .12s } .reveal > *:nth-child(5) { animation-delay: .16s } .reveal > *:nth-child(6) { animation-delay: .2s }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }

h1.screen-title { font-weight: 400; font-size: 30px; line-height: 1.15; margin: 8px 0 16px; letter-spacing: -0.01em; text-wrap: balance; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-soft); }
.muted { color: var(--fg-soft); }

/* round icon buttons */
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: none; display: grid; place-items: center; background: var(--chip); color: var(--fg); transition: transform .15s, background .2s; flex: none; }
.icon-btn:active { transform: scale(.94); }
.icon-btn.dark { background: var(--black); color: var(--white); }
:root[data-theme="dark"] .icon-btn.dark { background: var(--white); color: var(--black); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .icon-btn.dark { background: var(--white); color: var(--black); } }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* app switcher */
.switcher { display: flex; gap: 6px; }
.sw { height: 44px; min-width: 44px; border: none; border-radius: var(--r-pill); display: flex; align-items: center; gap: 8px; padding: 0 11px; background: var(--lavender); color: var(--black); font-weight: 600; font-size: 14px; overflow: hidden; white-space: nowrap; transition: background .3s, color .3s, padding .3s, max-width .35s cubic-bezier(.2,.8,.2,1); max-width: 44px; }
.sw .label { opacity: 0; transition: opacity .2s; }
.sw.on { max-width: 140px; padding: 0 16px 0 12px; }
.sw.on .label { opacity: 1; transition-delay: .12s; }
.sw.on.language { background: var(--violet); color: var(--white); }
.sw.on.note { background: var(--indigo); color: var(--black); }
.sw.on.habits { background: var(--orchid); color: var(--white); }

/* bottom nav pill */
.nav { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 2px; padding: 6px; border-radius: var(--r-pill); background: var(--nav); box-shadow: 0 10px 24px rgba(0,0,0,0.25); backdrop-filter: blur(10px); z-index: 5; }
.nav button { width: 46px; height: 46px; border-radius: 50%; border: none; background: transparent; color: var(--nav-fg); display: grid; place-items: center; position: relative; transition: background .25s, color .25s, transform .15s; }
.nav button.on { background: var(--nav-active); color: var(--nav-active-fg); }
.nav button:active { transform: scale(.92); }
.nav .dot { position: absolute; top: 7px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--indigo); }

/* chips */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 6px 0 16px; border-radius: var(--r-pill); border: 1.5px solid var(--line); background: var(--chip); font-weight: 500; transition: background .2s, color .2s; }
.chip.solo { padding: 0 16px; }
.chip .count { min-width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--white); color: var(--black); font-size: 13px; font-weight: 600; }
.chip.on { background: var(--accent, var(--violet)); color: var(--accent-fg, var(--white)); border-color: transparent; }

/* cards */
.card { position: relative; border-radius: var(--r-card); padding: 20px; margin-bottom: 12px; background: var(--surface); }
.block { position: relative; border-radius: var(--r-card); padding: 20px 20px 18px; margin-bottom: 10px; min-height: 150px; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; transition: transform .2s; }
.block:active { transform: scale(.985); }
.block h3 { margin: 0; font-weight: 400; font-size: 22px; line-height: 1.2; max-width: 75%; }
.block .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
.block .corner { position: absolute; top: 8px; right: 8px; width: 52px; height: 52px; border-radius: 50%; border: none; background: var(--white); color: var(--black); display: grid; place-items: center; }
.tag { border: 1.5px solid currentColor; border-radius: var(--r-pill); padding: 8px 14px; font-weight: 600; font-size: 12px; opacity: .85; }
.b-ink { background: var(--block-ink); color: var(--block-ink-fg); }
.b-violet { background: var(--violet); color: var(--white); }
.b-indigo { background: var(--indigo); color: var(--black); }
.b-lavender { background: var(--lavender); color: var(--black); }
.b-orchid { background: var(--orchid); color: var(--white); }
.bar { height: 30px; border-radius: var(--r-pill); background: rgba(127,127,127,0.18); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: var(--r-pill); background: repeating-linear-gradient(135deg, var(--indigo) 0 8px, #a9a4f4 8px 16px); transition: width .8s cubic-bezier(.2,.8,.2,1); }

.btn { height: 52px; border-radius: var(--r-pill); border: none; padding: 0 22px; font-weight: 600; background: var(--accent, var(--violet)); color: var(--accent-fg, var(--white)); width: 100%; transition: transform .15s, opacity .2s; }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--fg); border: 1.5px solid var(--line); }

/* quiz */
.options { display: grid; gap: 10px; margin: 16px 0; }
.opt { display: flex; align-items: center; gap: 12px; min-height: 56px; border-radius: 20px; border: 1.5px solid var(--line); background: var(--surface); padding: 0 16px; text-align: left; font-size: 16px; transition: background .2s, border-color .2s; }
.opt .k { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--lavender); color: var(--black); font-size: 13px; font-weight: 600; flex: none; }
.opt.picked { border-color: var(--violet); background: color-mix(in srgb, var(--lavender) 50%, transparent); }
.opt.right { border-color: var(--violet); background: var(--violet); color: var(--white); }
.opt.wrong { border-color: var(--orchid); background: var(--orchid); color: var(--white); }
.feedback { display: flex; align-items: center; gap: 12px; border-radius: 22px; padding: 14px 16px; margin-bottom: 12px; font-weight: 600; animation: rise .35s both; }
.feedback .badge { width: 36px; height: 36px; border-radius: 50%; background: var(--white); color: var(--black); display: grid; place-items: center; flex: none; }
.feedback.right { background: var(--violet); color: var(--white); }
.feedback.wrong { background: var(--orchid); color: var(--white); }
.burst { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 6; }
.burst i { position: absolute; width: 10px; height: 10px; border-radius: 50%; animation: pop 1s ease-out forwards; }
@keyframes pop { from { transform: translate(0,0) scale(1); opacity: 1; } to { transform: translate(var(--x), var(--y)) scale(.4); opacity: 0; } }

/* flashcard */
.flip { perspective: 900px; height: 230px; margin: 10px 0 16px; }
.flip-inner { position: relative; width: 100%; height: 100%; transition: transform .6s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; }
.flip.on .flip-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; border-radius: var(--r-card); display: grid; place-items: center; text-align: center; padding: 20px; backface-visibility: hidden; font-size: 30px; }
.face small { display: block; font-size: 13px; opacity: .75; margin-top: 8px; }
.face.back { transform: rotateY(180deg); }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
.cal .wd { font-size: 13px; color: var(--fg-soft); padding: 4px 0; }
.cal .d { aspect-ratio: 1; max-width: 100%; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 500; background: var(--chip); position: relative; border: none; }
.cal .d svg { position: absolute; bottom: 1px; width: 11px; height: 11px; stroke-width: 2.6; }
.cal .done { background: var(--black); color: var(--white); }
:root[data-theme="dark"] .cal .done { background: var(--white); color: var(--black); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cal .done { background: var(--white); color: var(--black); } }
.cal .part { background: var(--indigo); color: var(--black); }
.cal .frozen { background: var(--lavender); color: var(--black); }
.cal .today { outline: 2px solid var(--orchid); outline-offset: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; margin-top: 14px; color: var(--fg-soft); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }

/* chart */
.chart { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 220px; }
.col { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; border-radius: 22px; background: var(--chip); overflow: hidden; }
.col i { display: block; transition: height .8s cubic-bezier(.2,.8,.2,1); }
.col .s1 { background: repeating-linear-gradient(135deg, var(--black) 0 6px, #222 6px 12px); }
:root[data-theme="dark"] .col .s1 { background: var(--white); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .col .s1 { background: var(--white); } }
.col .s2 { background: var(--indigo); }
.col .s3 { background: var(--lavender); }
.axis { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; font-size: 13px; margin-top: 8px; color: var(--fg-soft); }

/* habits */
.habit-check { position: absolute; top: 8px; right: 8px; width: 52px; height: 52px; border-radius: 50%; border: 2px solid currentColor; background: transparent; color: inherit; display: grid; place-items: center; transition: background .25s, transform .2s; }
.habit-check.done { background: var(--white); color: var(--black); border-color: var(--white); }
.habit-check:active { transform: scale(.9); }
.counter { display: inline-flex; align-items: center; gap: 10px; }
.counter button { width: 36px; height: 36px; border-radius: 50%; border: none; background: rgba(255,255,255,0.85); color: var(--black); display: grid; place-items: center; }

/* note */
.covers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cover { border: none; text-align: left; border-radius: 24px; padding: 16px; height: 170px; display: flex; flex-direction: column; justify-content: space-between; font-size: 17px; transition: transform .2s; }
.cover:active { transform: scale(.97); }
.cover small { font-size: 12px; opacity: .8; }
.editor { position: absolute; inset: 0; background: var(--bg); z-index: 4; display: flex; flex-direction: column; animation: enter .35s cubic-bezier(.2,.8,.2,1); }
.editor header { display: flex; align-items: center; gap: 10px; padding: 52px 16px 10px; }
.editor header h2 { margin: 0; font-size: 18px; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.paper-wrap { position: relative; flex: 1; margin: 0 12px 16px; border-radius: 22px; overflow: hidden; background: var(--paper); background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--paper-line) 31px 32px); }
.paper-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.paper-wrap .hint { position: absolute; left: 16px; top: 14px; font-size: 13px; color: var(--fg-soft); pointer-events: none; }
.tools { position: absolute; display: flex; gap: 4px; padding: 6px; border-radius: var(--r-pill); background: var(--black); color: var(--white); box-shadow: 0 10px 24px rgba(0,0,0,0.3); z-index: 3; transition: top .35s cubic-bezier(.2,.8,.2,1), left .35s cubic-bezier(.2,.8,.2,1); touch-action: none; }
.tools.dragging { transition: none; }
.tools.vertical { flex-direction: column; }
.tools button { width: 40px; height: 40px; border-radius: 50%; border: none; background: transparent; color: var(--white); display: grid; place-items: center; }
.tools button.on { background: var(--white); color: var(--black); }
.tools .grip { cursor: grab; opacity: .7; }
.tools .sw-col { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--white); }

/* sheet */
.sheet-back { position: absolute; inset: 0; background: rgba(0,0,0,0.4); z-index: 7; animation: fade .25s both; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--bg); border-radius: 32px 32px 0 0; padding: 22px 16px 34px; animation: up .35s cubic-bezier(.2,.8,.2,1) both; }
@keyframes up { from { transform: translateY(100%); } }
.field { display: grid; gap: 8px; margin: 14px 0; }
.field input { height: 52px; border-radius: 18px; border: 1.5px solid var(--line); background: var(--surface); padding: 0 16px; }

/* list rows */
.rowlist { display: grid; gap: 8px; }
.rowitem { display: flex; align-items: center; gap: 14px; border-radius: 22px; background: var(--surface); padding: 12px 14px; border: none; text-align: left; width: 100%; }
.rowitem .ic { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.rowitem b { font-weight: 500; display: block; }
.rowitem small { color: var(--fg-soft); }

/* side panel */
.panel { width: min(420px, 100%); display: grid; gap: 18px; min-width: 0; }
.panel h1 { font-weight: 400; font-size: 34px; margin: 0; line-height: 1.1; text-wrap: balance; }
.panel p { margin: 0; line-height: 1.55; max-width: 60ch; }
.panel section { background: var(--surface); border-radius: 24px; padding: 18px; display: grid; gap: 12px; }
.panel h2 { margin: 0; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-soft); font-weight: 600; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg .chip { height: 40px; padding: 0 16px; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.swatch { border-radius: 16px; padding: 12px; min-height: 76px; display: flex; flex-direction: column; justify-content: flex-end; font-size: 12px; border: 1.5px solid var(--line); }
.swatch b { font-size: 13px; font-weight: 600; }
.panel ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; line-height: 1.5; }

@media (max-width: 440px) {
  .phone { height: 720px; border-width: 6px; border-radius: 36px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

</div>

      for (let d = 1; d <= 30; d++) {
        const s = states[d] ?? '';
        const mark = s === 'done' ? ic('check') : s === 'part' ? ic('half') : s === 'frozen' ? ic('snow') : '';
        cells.push(`<button class="d ${s} ${d === 20 ? 'today' : ''}" aria-label="${d}${s ? ', ' + t({ done: 'lDone', part: 'lPart', frozen: 'lFrozen' }[s]) : ''}">${d}${mark}</button>`);
      }
      return `
        ${title('calTitle')}
        <div class="card">
          <div class="cal">${t('wds').split(' ').map((w) => `<span class="wd">${w}</span>`).join('')}${cells.join('')}</div>
          <div class="legend">
            <span><i style="background:var(--black);border:1px solid var(--line)"></i>${ic('check', 'style="width:12px;height:12px"')} ${t('lDone')}</span>
            <span><i style="background:var(--indigo)"></i>${ic('half', 'style="width:12px;height:12px"')} ${t('lPart')}</span>
            <span><i style="background:var(--lavender)"></i>${ic('snow', 'style="width:12px;height:12px"')} ${t('lFrozen')}</span>
          </div>
        </div>`;
    },
    list: () => `
      ${title('listTitle')}
      <div class="rowlist">
        ${S.habits.map((h) => `<div class="rowitem"><span class="ic ${h.color}">${ic(h.kind === 'auto' ? 'language' : 'habits')}</span><span><b>${esc(habitName(h))}</b><small>${h.kind === 'auto' ? t('auto') : h.id === 'h4' ? t('perWeek') : t('daily')}</small></span></div>`).join('')}
      </div>`,
    me: () => {
      const data = [[30, 25, 20], [20, 30, 15], [24, 18, 25], [12, 10, 8], [16, 14, 30], [20, 18, 12], [10, 45, 20]];
      return `
        ${title('meTitle')}
        <div class="chips">
          <span class="chip">${t('consistency')}<span class="count">86%</span></span>
          <span class="chip">${t('best')}<span class="count">21</span></span>
        </div>
        <div class="chart" role="img" aria-label="${t('meTitle')}">
          ${data.map(([a, b, c]) => `<div class="col"><i class="s3" style="height:${c}%"></i><i class="s2" style="height:${b}%"></i><i class="s1" style="height:${a}%"></i></div>`).join('')}
        </div>
        <div class="axis">${t('mon').split(' ').map((d) => `<span>${d}</span>`).join('')}</div>`;
    },
  };

  function habitCard(h) {
    const done = habitDone(h);
    const meta = h.kind === 'auto' ? t('auto') : h.kind === 'count' ? `${h.value}/${h.target} ${t(h.unit)}` : t('perWeek');
    const control = h.kind === 'count'
      ? `<span class="counter"><button data-hc="${h.id}" data-d="-1" aria-label="${t('less')}">${ic('minus')}</button><button data-hc="${h.id}" data-d="1" aria-label="${t('more')}">${ic('plus')}</button></span>`
      : `<span class="tag">${h.kind === 'auto' ? t('auto') : t('daily')}</span>`;
    return `
      <div class="block ${h.color}">
        <h3>${esc(habitName(h))}</h3>
        <button class="habit-check ${done ? 'done' : ''}" data-hdone="${h.id}" aria-pressed="${done}" aria-label="${done ? t('undoDone') : t('markDone')}" ${h.kind === 'auto' ? 'disabled' : ''}>${ic('check')}</button>
        ${h.kind === 'count' ? `<div class="bar" style="background:rgba(0,0,0,.12);height:14px"><i style="width:${Math.min(100, (h.value / h.target) * 100)}%;background:currentColor;opacity:.75"></i></div>` : ''}
        <div class="row"><span>${meta}</span>${control}</div>
      </div>`;
  }

  /* ---------- render ---------- */
  const VIEWS = { language: LANG, note: NOTE, habits: HAB };
  function renderScreen() {
    const view = VIEWS[S.app][S.tab[S.app]];
    $('screen').innerHTML = `<div class="reveal">${view()}</div>`;
    renderOverlay();
  }
  function render() { applyTheme(); renderTop(); renderNav(); renderScreen(); renderPanel(); }

  function renderOverlay() {
    let html = '';
    if (S.app === 'note' && S.noteOpen) {
      html += `
        <div class="editor">
          <header>
            <button class="icon-btn" data-act="closeNb" aria-label="${t('backLib')}">${ic('back')}</button>
            <h2>${t(S.noteOpen)}</h2>
          </header>
          <div class="paper-wrap" id="paper">
            <span class="hint">${t('draw')}</span>
            <canvas id="ink"></canvas>
            <div class="tools ${S.toolEdge === 'left' || S.toolEdge === 'right' ? 'vertical' : ''}" id="tools" role="toolbar" aria-label="${t('n.library')}">
              <button class="grip" id="grip" aria-label="${t('tMove')}" title="${t('tMove')}">${ic('grip')}</button>
              ${[['pen', 'tPen'], ['marker', 'tMarker'], ['eraser', 'tEraser'], ['text', 'tText']].map(([k, l]) => `<button class="${S.tool === k ? 'on' : ''}" data-tool="${k}" aria-label="${t(l)}" aria-pressed="${S.tool === k}" title="${t(l)}">${ic(k)}</button>`).join('')}
              <button data-act="undoInk" aria-label="${t('tUndo')}" title="${t('tUndo')}">${ic('undo')}</button>
            </div>
          </div>
        </div>`;
    }
    if (S.sheet) {
      html += `
        <div class="sheet-back" data-act="closeSheet"></div>
        <form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
          <h2 id="sheet-title" style="margin:0;font-weight:400;font-size:24px">${S.app === 'note' ? t('nb1').split(' ')[0] + '…' : t('newHabit')}</h2>
          <label class="field"><span class="eyebrow">${t('habitName')}</span><input id="habit-name" placeholder="${t('habitPh')}" maxlength="40" autocomplete="off"></label>
          <div style="display:grid;gap:8px">
            <button class="btn" type="submit">${t('save')}</button>
            <button class="btn ghost" type="button" data-act="closeSheet">${t('cancel')}</button>
          </div>
        </form>`;
    }
    $('overlay').innerHTML = html;
    if (S.app === 'note' && S.noteOpen) setupEditor();
    if (S.sheet) setTimeout(() => $('habit-name')?.focus(), 50);
  }

  /* ---------- note editor: drawing and draggable toolbar ---------- */
  let strokes = [];
  function setupEditor() {
    const paper = $('paper');
    const canvas = $('ink');
    const tools = $('tools');
    const ctx = canvas.getContext('2d');
    const size = () => {
      const r = paper.getBoundingClientRect();
      canvas.width = r.width * devicePixelRatio; canvas.height = r.height * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      redraw();
    };
    const style = (s) => {
      const css = getComputedStyle(document.documentElement);
      if (s.tool === 'marker') { ctx.strokeStyle = 'rgba(151,145,241,0.45)'; ctx.lineWidth = 16; }
      else { ctx.strokeStyle = css.getPropertyValue('--fg').trim() || '#000'; ctx.lineWidth = 2.6; }
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    };
    function redraw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const s of strokes) {
        if (s.points.length < 2) continue;
        style(s); ctx.beginPath(); ctx.moveTo(s.points[0][0], s.points[0][1]);
        for (const p of s.points.slice(1)) ctx.lineTo(p[0], p[1]);
        ctx.stroke();
      }
    }
    setupEditor.redraw = redraw;
    size();
    placeTools(false);

    let current = null;
    canvas.addEventListener('pointerdown', (e) => {
      const r = canvas.getBoundingClientRect();
      const pt = [e.clientX - r.left, e.clientY - r.top];
      if (S.tool === 'eraser') { strokes = strokes.filter((s) => !s.points.some((p) => Math.hypot(p[0] - pt[0], p[1] - pt[1]) < 14)); redraw(); return; }
      if (S.tool === 'text') return;
      paper.querySelector('.hint')?.remove();
      current = { tool: S.tool, points: [pt] }; strokes.push(current);
      canvas.setPointerCapture?.(e.pointerId);
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!current) return;
      const r = canvas.getBoundingClientRect();
      current.points.push([e.clientX - r.left, e.clientY - r.top]); redraw();
    });
    const end = () => { current = null; };
    canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);

    // drag the toolbar by its grip, snap to the nearest edge
    const grip = $('grip');
    let drag = null;
    grip.addEventListener('pointerdown', (e) => {
      const pr = paper.getBoundingClientRect(); const tr = tools.getBoundingClientRect();
      drag = { dx: e.clientX - tr.left, dy: e.clientY - tr.top, pr };
      tools.classList.add('dragging'); grip.setPointerCapture?.(e.pointerId); e.preventDefault();
    });
    grip.addEventListener('pointermove', (e) => {
      if (!drag) return;
      tools.style.left = `${e.clientX - drag.pr.left - drag.dx}px`;
      tools.style.top = `${e.clientY - drag.pr.top - drag.dy}px`;
    });
    const drop = (e) => {
      if (!drag) return;
      const { pr } = drag; drag = null; tools.classList.remove('dragging');
      const x = (e.clientX - pr.left) / pr.width; const y = (e.clientY - pr.top) / pr.height;
      const d = { top: y, bottom: 1 - y, left: x, right: 1 - x };
      S.toolEdge = Object.entries(d).sort((a, b) => a[1] - b[1])[0][0];
      store.set('toolEdge', S.toolEdge);
      tools.classList.toggle('vertical', S.toolEdge === 'left' || S.toolEdge === 'right');
      requestAnimationFrame(() => placeTools(true));
    };
    grip.addEventListener('pointerup', drop); grip.addEventListener('pointercancel', drop);
    grip.addEventListener('keydown', (e) => {
      const map = { ArrowUp: 'top', ArrowDown: 'bottom', ArrowLeft: 'left', ArrowRight: 'right' };
      if (!map[e.key]) return;
      e.preventDefault(); S.toolEdge = map[e.key]; store.set('toolEdge', S.toolEdge);
      tools.classList.toggle('vertical', S.toolEdge === 'left' || S.toolEdge === 'right'); placeTools(true);
    });
  }
  function placeTools() {
    const paper = $('paper'); const tools = $('tools');
    if (!paper || !tools) return;
    const pw = paper.clientWidth, ph = paper.clientHeight, tw = tools.offsetWidth, th = tools.offsetHeight, m = 12;
    const pos = {
      top: [(pw - tw) / 2, m], bottom: [(pw - tw) / 2, ph - th - m],
      left: [m, (ph - th) / 2], right: [pw - tw - m, (ph - th) / 2],
    }[S.toolEdge];
    tools.style.left = `${pos[0]}px`; tools.style.top = `${pos[1]}px`;
  }

  /* ---------- side panel ---------- */
  function renderPanel() {
    const sw = [['Violet Blue', '#484AAA', '#fff'], ['Tropical Indigo', '#9791F1', '#000'], ['Medium Orchid', '#9847B4', '#fff'], ['Pale Purple', '#F7EBF9', '#000'], ['Pale Lavender', '#DDC2F2', '#000'], ['Black', '#000000', '#fff'], ['White', '#FFFFFF', '#000']];
    $('panel').innerHTML = `
      <h1>${t('panelTitle')}</h1>
      <p class="muted">${t('panelLead')}</p>
      <section>
        <h2>${t('uiLang')} · ${t('theme')}</h2>
        <div class="seg">${['vi', 'en'].map((l) => `<button class="chip solo ${S.locale === l ? 'on' : ''}" data-locale="${l}" aria-pressed="${S.locale === l}" style="--accent:var(--violet);--accent-fg:#fff">${l === 'vi' ? 'Tiếng Việt' : 'English'}</button>`).join('')}</div>
        <div class="seg">${['light', 'dark', 'system'].map((m) => `<button class="chip solo ${S.theme === m ? 'on' : ''}" data-theme-set="${m}" aria-pressed="${S.theme === m}" style="--accent:var(--violet);--accent-fg:#fff">${t(m)}</button>`).join('')}</div>
      </section>
      <section>
        <h2>${t('tryTitle')}</h2>
        <ul><li>${t('try1')}</li><li>${t('try2')}</li><li>${t('try3')}</li><li>${t('try4')}</li></ul>
      </section>
      <section>
        <h2>${t('paletteTitle')}</h2>
        <div class="swatches">${sw.map(([n, h, f]) => `<div class="swatch" style="background:${h};color:${f}"><b>${n}</b><span>${h}</span></div>`).join('')}</div>
      </section>
      <section>
        <h2>${t('decisions')}</h2>
        <ul>${['d1', 'd2', 'd3', 'd4', 'd5', 'd6'].map((k) => `<li>${t(k)}</li>`).join('')}</ul>
      </section>`;
  }

  /* ---------- transitions ---------- */
  function switchApp(app) {
    if (app === S.app) return;
    const screen = $('screen');
    const go = () => {
      S.app = app; S.noteOpen = null; S.sheet = false;
      renderTop(); renderNav(); renderScreen();
      screen.classList.remove('leaving'); screen.classList.add('entering');
      screen.scrollTop = 0;
      setTimeout(() => screen.classList.remove('entering'), 400);
    };
    // the pill moves first, then the content follows
    document.querySelectorAll('.sw').forEach((b) => b.classList.toggle('on', b.dataset.app === app));
    if (reduced()) return go();
    screen.classList.add('leaving');
    setTimeout(go, 230);
  }
  function setTab(tab) {
    if (S.tab[S.app] === tab) return;
    S.tab[S.app] = tab; S.noteOpen = null;
    renderTop(); renderNav(); renderScreen(); $('screen').scrollTop = 0;
  }
  function burst() {
    if (reduced()) return;
    const b = document.createElement('div'); b.className = 'burst';
    const colors = ['#484AAA', '#9791F1', '#9847B4', '#DDC2F2'];
    for (let i = 0; i < 26; i++) {
      const s = document.createElement('i');
      const a = (Math.PI * 2 * i) / 26; const d = 90 + Math.random() * 90;
      s.style.cssText = `left:50%;top:60%;background:${colors[i % 4]};--x:${Math.cos(a) * d}px;--y:${Math.sin(a) * d - 40}px`;
      b.appendChild(s);
    }
    phone.appendChild(b); setTimeout(() => b.remove(), 1100);
  }

  /* ---------- events ---------- */
  document.addEventListener('click', (e) => {
    const el = e.target.closest('button, [data-act]');
    if (!el) return;
    const d = el.dataset;
    if (d.app) return switchApp(d.app);
    if (d.tab) return setTab(d.tab);
    if (d.locale) { S.locale = d.locale; store.set('locale', S.locale); return render(); }
    if (d.themeSet) { S.theme = d.themeSet; store.set('theme', S.theme); applyTheme(); renderScreen(); return renderPanel(); }
    if (d.lang) { S.langTab = d.lang; return renderScreen(); }
    if (d.opt !== undefined) { S.quiz.picked = Number(d.opt); return renderScreen(); }
    if (d.hf) { S.habitFilter = d.hf; return renderScreen(); }
    if (d.nb) { S.noteOpen = d.nb; strokes = []; renderTop(); renderNav(); return renderOverlay(); }
    if (d.tool) { S.tool = d.tool; document.querySelectorAll('#tools [data-tool]').forEach((b) => { b.classList.toggle('on', b.dataset.tool === S.tool); b.setAttribute('aria-pressed', b.dataset.tool === S.tool); }); return; }
    if (d.hdone) { const h = S.habits.find((x) => x.id === d.hdone); if (h.kind === 'count') h.value = habitDone(h) ? 0 : h.target; else h.done = !h.done; if (habitDone(h)) burst(); return renderScreen(); }
    if (d.hc) { const h = S.habits.find((x) => x.id === d.hc); const was = habitDone(h); h.value = Math.max(0, Math.min(h.target, h.value + Number(d.d))); if (!was && habitDone(h)) burst(); return renderScreen(); }
    switch (d.act) {
      case 'check': S.quiz.checked = true; if (S.quiz.picked === 1) burst(); return renderScreen();
      case 'nextQ': S.quiz = { picked: null, checked: false }; return renderScreen();
      case 'goPractice': return setTab('practice');
      case 'flip': S.flipped = !S.flipped; return document.querySelector('.flip')?.classList.toggle('on', S.flipped);
      case 'grade': S.flipped = false; S.cardsLeft = Math.max(0, S.cardsLeft - 1); renderNav(); return renderScreen();
      case 'add': S.sheet = true; return renderOverlay();
      case 'closeSheet': S.sheet = false; return renderOverlay();
      case 'closeNb': S.noteOpen = null; renderTop(); renderNav(); return renderOverlay();
      case 'undoInk': strokes.pop(); return setupEditor.redraw?.();
    }
  });
  document.addEventListener('submit', (e) => {
    if (e.target.id !== 'sheet') return;
    e.preventDefault();
    const name = $('habit-name').value.trim();
    if (S.app === 'habits' && name) {
      S.habits.push({ id: 'u' + Date.now(), name, kind: 'check', done: false, color: ['b-violet', 'b-indigo', 'b-lavender', 'b-orchid'][S.habits.length % 4] });
      S.habitFilter = 'todo';
    }
    S.sheet = false; renderOverlay(); renderScreen();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.sheet) { S.sheet = false; renderOverlay(); } });
  window.addEventListener('resize', () => placeTools());

  render();
})();
</script>
</body>
</html>
